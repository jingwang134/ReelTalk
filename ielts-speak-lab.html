<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReelTalk — 从影视学口语</title>
<style>
:root {
  --green: #58cc02; --green-d: #46a302; --green-l: #d7ffb8;
  --blue: #1cb0f6; --blue-l: #ddf4ff;
  --red: #ff4b4b; --red-l: #ffdfe0;
  --gold: #ffc800; --gold-l: #fff4cc;
  --purple: #ce82ff; --purple-l: #f5e6ff;
  --orange: #ff9600;
  --bg: #fff; --bg2: #f7f7f7; --border: #e5e5e5;
  --text: #3c3c3c; --text2: #777; --text3: #afafaf;
  --radius: 14px; --radius-sm: 10px; --radius-xs: 6px;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.1);
  --font: -apple-system,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg2); color:var(--text); line-height:1.6; }
button { font-family:var(--font); cursor:pointer; }

/* ===== HEADER ===== */
.header { background:var(--bg); border-bottom:1px solid var(--border); padding:0 20px; height:56px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50; }
.logo { font-size:20px; font-weight:800; }
.logo .r { color:var(--green); }
.logo .t { color:var(--text); }
.header-spacer { flex:1; }
.header-stat { display:flex; align-items:center; gap:4px; font-weight:700; font-size:14px; }
.header-stat.xp { color:var(--gold); }
.header-stat.streak { color:var(--orange); }
.header-stat .icon { font-size:18px; }

/* ===== TABS ===== */
.tabs { display:flex; background:var(--bg); border-bottom:1px solid var(--border); padding:0 20px; gap:2px; position:sticky; top:56px; z-index:49; }
.tab { padding:10px 18px; font-size:14px; font-weight:700; border:none; background:none; color:var(--text3); cursor:pointer; border-bottom:3px solid transparent; transition:.15s; display:flex; align-items:center; gap:6px; }
.tab.active { color:var(--green); border-bottom-color:var(--green); }
.tab:hover:not(.active) { color:var(--text2); }
.tab .badge { background:var(--red); color:#fff; font-size:10px; padding:1px 6px; border-radius:8px; font-weight:700; }

/* ===== MAIN LAYOUT ===== */
.view { display:none; }
.view.active { display:flex; }

/* ============ TAB 1: 话题 ============ */
.topic-view { gap:0; height:calc(100vh - 104px); }
.topic-sidebar { width:200px; background:var(--bg); border-right:1px solid var(--border); overflow-y:auto; padding:12px 0; flex-shrink:0; }
.topic-sidebar h3 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); padding:8px 16px 4px; }
.sidebar-item { padding:10px 16px; font-size:13px; cursor:pointer; transition:.1s; display:flex; align-items:center; gap:8px; font-weight:500; color:var(--text2); }
.sidebar-item:hover { background:var(--bg2); }
.sidebar-item.active { background:var(--green-l); color:var(--green-d); font-weight:700; border-radius:0 var(--radius-xs) var(--radius-xs) 0; }
.sidebar-item .emoji { font-size:16px; }
.topic-main { flex:1; overflow-y:auto; padding:24px; }
.topic-main h2 { font-size:22px; margin-bottom:8px; }
.topic-main .subtitle { color:var(--text2); font-size:13px; margin-bottom:20px; }

/* Question Card */
.qcard { background:var(--bg); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); margin-bottom:16px; }
.qcard .q-label { font-size:11px; font-weight:800; text-transform:uppercase; color:var(--blue); letter-spacing:1px; margin-bottom:8px; }
.qcard .q-text { font-size:17px; font-weight:600; line-height:1.5; }
.qcard .q-hint { font-size:12px; color:var(--text3); margin-top:10px; display:flex; gap:12px; }
.qcard .q-hint span { background:var(--bg2); padding:4px 10px; border-radius:12px; }

/* Style Chips */
.style-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
.style-row .label { font-size:13px; font-weight:700; color:var(--text2); white-space:nowrap; }
.style-chip { padding:6px 14px; border-radius:20px; border:2px solid var(--border); font-size:13px; font-weight:700; background:var(--bg); transition:.15s; }
.style-chip.active { border-color:var(--green); background:var(--green-l); color:var(--green-d); }
.style-chip .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; }

/* Action Buttons */
.btn-row { display:flex; gap:10px; margin:16px 0; }
.btn { padding:10px 20px; border-radius:20px; border:none; font-weight:700; font-size:14px; transition:.15s; display:flex; align-items:center; gap:6px; }
.btn-primary { background:var(--green); color:#fff; box-shadow:0 3px 0 var(--green-d); }
.btn-primary:active { transform:translateY(2px); box-shadow:0 1px 0 var(--green-d); }
.btn-secondary { background:var(--bg); border:2px solid var(--border); color:var(--text); }
.btn-secondary:hover { background:var(--bg2); }
.btn-accent { background:var(--blue); color:#fff; box-shadow:0 3px 0 #1493d4; }
.btn-accent:active { transform:translateY(2px); box-shadow:0 1px 0 #1493d4; }
.btn-ghost { background:none; border:none; color:var(--text2); font-weight:600; }
.btn-sm { padding:6px 14px; font-size:12px; }

/* Answer Card */
.acard { background:var(--bg); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); margin-top:12px; display:none; }
.acard.show { display:block; animation:fadeIn .3s ease; }
.acard .acard-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.acard .acard-style { font-size:12px; color:var(--blue); font-weight:700; }
.acard .acard-text { font-size:16px; line-height:1.8; white-space:pre-wrap; }
.acard .acard-text .hl { background:var(--gold-l); padding:1px 4px; border-radius:3px; cursor:pointer; font-weight:600; transition:.15s; }
.acard .acard-text .hl:hover { background:var(--gold); }
.acard .acard-text .hl.saved { background:var(--green-l); }
.acard .acard-actions { display:flex; gap:10px; margin-top:16px; }

/* Answer Card Sections */
.acard-section { margin-top:16px; padding-top:16px; border-top:1px dashed var(--border); }
.acard-section-title { font-size:12px; font-weight:800; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
.acard-zh { font-size:14px; line-height:1.8; color:var(--text2); }
.expr-chips { display:flex; flex-wrap:wrap; gap:8px; }
.expr-chip { display:inline-flex; flex-direction:column; gap:2px; padding:8px 12px; background:var(--bg2); border-radius:var(--radius-xs); border:1px solid var(--border); cursor:pointer; transition:.15s; font-size:13px; }
.expr-chip:hover { background:var(--green-l); border-color:var(--green); }
.expr-chip b { color:var(--green-d); font-weight:700; }
.expr-chip-zh { font-size:11px; color:var(--text2); }

@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* Practice Overlay */
.practice-overlay { position:fixed; inset:0; background:var(--bg); z-index:100; display:none; flex-direction:column; }
.practice-overlay.show { display:flex; animation:slideUp .3s ease; }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.practice-top { padding:16px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); }
.practice-close { width:36px; height:36px; border-radius:50%; border:none; background:var(--bg2); font-size:18px; display:flex; align-items:center; justify-content:center; }
.practice-title { font-weight:700; font-size:15px; }
.practice-spacer { flex:1; }
.practice-body { flex:1; overflow-y:auto; padding:40px 24px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.practice-text { font-size:24px; line-height:1.8; text-align:center; margin-bottom:32px; max-width:600px; font-weight:500; }
.practice-text .word { display:inline; transition:color .2s; }
.practice-text .word.active { color:var(--green); font-weight:800; }
.practice-text .word.done { color:var(--text2); }
.big-play-btn { width:80px; height:80px; border-radius:50%; border:none; font-size:32px; background:var(--green); color:#fff; box-shadow:0 6px 0 var(--green-d); transition:.1s; display:flex; align-items:center; justify-content:center; }
.big-play-btn:active { transform:translateY(3px); box-shadow:0 3px 0 var(--green-d); }
.big-play-btn.playing { background:var(--red); box-shadow:0 6px 0 #d33; }
.speed-controls { display:flex; gap:8px; margin-top:20px; }
.speed-btn { padding:6px 14px; border-radius:16px; border:2px solid var(--border); font-size:13px; font-weight:700; background:var(--bg); }
.speed-btn.active { border-color:var(--blue); background:var(--blue-l); color:#1493d4; }
.practice-footer { padding:16px 20px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:center; }

/* ============ TAB 2: 地道表达 ============ */
.expr-view { flex-direction:column; height:calc(100vh - 104px); }
.expr-cats { display:flex; gap:4px; padding:12px 20px; overflow-x:auto; background:var(--bg); border-bottom:1px solid var(--border); }
.expr-cat { padding:7px 16px; border-radius:20px; border:2px solid var(--border); font-size:13px; font-weight:600; white-space:nowrap; background:#fff; transition:.15s; }
.expr-cat.active { border-color:var(--purple); background:var(--purple-l); color:#8b3fd4; }
.expr-cat:hover:not(.active) { background:var(--bg2); }
.expr-body { flex:1; overflow-y:auto; padding:20px; }
.expr-toolbar { display:flex; gap:10px; margin-bottom:16px; align-items:center; }
.expr-toolbar .search { flex:1; padding:8px 14px; border-radius:20px; border:2px solid var(--border); font-size:13px; font-family:var(--font); outline:none; max-width:300px; }
.expr-toolbar .search:focus { border-color:var(--purple); }
.expr-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
.expr-card { background:var(--bg); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); transition:.15s; position:relative; }
.expr-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
.expr-card .phrase { font-size:20px; font-weight:800; color:var(--text); margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.expr-card .phrase .play-btn { width:28px; height:28px; border-radius:50%; border:2px solid var(--border); background:#fff; font-size:12px; display:flex; align-items:center; justify-content:center; transition:.15s; flex-shrink:0; }
.expr-card .phrase .play-btn:hover { background:var(--green-l); border-color:var(--green); }
.expr-card .meaning { font-size:13px; color:var(--text2); margin-bottom:8px; }
.expr-card .example { font-size:13px; background:var(--bg2); padding:10px 14px; border-radius:var(--radius-xs); line-height:1.6; margin-bottom:8px; font-style:italic; }
.expr-card .source { font-size:11px; color:var(--text3); }
.expr-card .fav-btn { position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%; border:2px solid var(--border); background:#fff; font-size:16px; display:flex; align-items:center; justify-content:center; transition:.15s; }
.expr-card .fav-btn.saved { border-color:var(--red); background:var(--red-l); }
.expr-card .tag { display:inline-block; font-size:10px; background:var(--purple-l); color:#8b3fd4; padding:2px 8px; border-radius:8px; margin-right:4px; font-weight:600; }
.flashcard-btn { background:var(--purple); color:#fff; border:none; padding:10px 20px; border-radius:20px; font-weight:700; font-size:14px; box-shadow:0 3px 0 #a060e0; transition:.1s; }
.flashcard-btn:active { transform:translateY(2px); box-shadow:0 1px 0 #a060e0; }

/* Flashcard Mode */
.flash-mode { position:fixed; inset:0; background:var(--bg); z-index:100; display:none; flex-direction:column; align-items:center; justify-content:center; }
.flash-mode.show { display:flex; }
.flash-card { width:340px; min-height:200px; perspective:1000px; cursor:pointer; }
.flash-inner { position:relative; width:100%; min-height:200px; transition:transform .5s; transform-style:preserve-3d; }
.flash-inner.flipped { transform:rotateY(180deg); }
.flash-front, .flash-back { position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius); padding:32px 24px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:var(--shadow-lg); }
.flash-front { background:var(--bg); border:3px solid var(--purple); z-index:2; }
.flash-back { background:var(--bg); border:3px solid var(--blue); transform:rotateY(180deg); }
.flash-front .big-phrase { font-size:28px; font-weight:800; text-align:center; }
.flash-back .big-meaning { font-size:17px; text-align:center; color:var(--text2); margin-bottom:12px; }
.flash-back .big-example { font-size:14px; text-align:center; background:var(--bg2); padding:12px 16px; border-radius:var(--radius-xs); }
.flash-controls { display:flex; gap:16px; margin-top:24px; }
.flash-close { position:absolute; top:20px; right:20px; width:40px; height:40px; border-radius:50%; border:none; background:var(--bg2); font-size:20px; }
.flash-counter { color:var(--text3); font-size:13px; margin-top:12px; }

/* ============ TAB 3: 阅读跟练 ============ */
.read-view { flex-direction:column; height:calc(100vh - 104px); }
.read-cats { display:flex; gap:4px; padding:12px 20px; overflow-x:auto; background:var(--bg); border-bottom:1px solid var(--border); flex-wrap:wrap; align-items:center; }
.read-cat { padding:6px 12px; border-radius:16px; border:1.5px solid var(--border); font-size:12px; font-weight:600; white-space:nowrap; background:#fff; transition:.15s; cursor:pointer; }
.read-cat:hover { border-color:var(--green); }
.read-cat.active { border-color:var(--green); background:#e8f8e0; color:var(--green); }
.read-grp-label { font-size:11px; color:var(--text3); padding:0 8px 0 2px; white-space:nowrap; display:flex; align-items:center; }
.read-subtitle { padding:8px 20px 0; font-size:13px; color:var(--text3); }
.read-body { flex:1; overflow-y:auto; padding:16px 20px 20px; }
.read-func-group { margin-bottom:20px; }
.func-tag { display:inline-block; padding:3px 12px; border-radius:12px; color:#fff; font-size:11px; font-weight:700; margin-bottom:8px; letter-spacing:.5px; }
.func-cards { display:flex; flex-direction:column; gap:10px; }
.read-section-title { font-size:16px; font-weight:700; margin:24px 0 12px; display:flex; align-items:center; gap:8px; }
.read-section-title .badge { font-size:11px; background:var(--gold-l); color:#b8860b; padding:2px 8px; border-radius:10px; font-weight:600; }
.empty-hint { text-align:center; color:var(--text3); padding:60px 20px; font-size:14px; }
.read-grid { }
.snippet-card { background:var(--bg); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); transition:.15s; position:relative; border-left:4px solid var(--border); }
.snippet-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-1px); }
.snippet-card .func-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.snippet-card .quote { font-size:16px; line-height:1.8; margin-bottom:10px; color:var(--text); }
.snippet-card .quote .qh { background:var(--gold-l); padding:1px 4px; border-radius:3px; font-weight:600; }
.snippet-card .meta { font-size:12px; color:var(--text3); display:flex; gap:16px; align-items:center; }
.snippet-card .actions { display:flex; gap:6px; margin-top:12px; align-items:center; }
.snippet-card .play-snippet { min-width:32px; height:32px; border-radius:16px; border:1.5px solid var(--green); background:#fff; font-size:12px; color:var(--green); display:flex; align-items:center; justify-content:center; transition:.15s; padding:0 10px; cursor:pointer; }
.snippet-card .play-snippet:hover { background:#e8f8e0; }
/* Card sections inside snippet cards */
.card-section { padding:8px 0; margin-top:8px; border-top:1px solid var(--border); font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:4px; user-select:none; transition:.15s; }
.card-section:hover { color:var(--green); }
.card-section-icon { font-size:14px; }
.card-toggle { font-size:10px; margin-left:auto; transition:.2s; }
.card-toggle.open { transform:rotate(90deg); }
.card-section-body { padding:0 0 4px 0; animation:fadeIn .2s ease; }
.card-trans-text { font-size:14px; color:var(--text2); line-height:1.7; padding:4px 0; }
.think-item { font-size:13px; line-height:1.6; color:var(--text2); padding:3px 0; }
.kw-tags { display:flex; flex-wrap:wrap; gap:6px; padding:4px 0; }
.kw-tag { display:inline-flex; align-items:center; gap:3px; padding:4px 10px; border-radius:12px; background:var(--gold-l); font-size:12px; font-weight:600; color:#b8860b; cursor:pointer; transition:.15s; }
.kw-tag:hover { background:#ffe082; transform:scale(1.03); }
.kw-tag small { font-weight:400; opacity:.7; font-size:10px; }

/* ===== MODALS & TOAST ===== */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:200; display:none; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--bg); border-radius:var(--radius); padding:24px; width:400px; max-width:90vw; box-shadow:var(--shadow-lg); }
.modal h3 { margin-bottom:12px; }
.modal input, .modal textarea { width:100%; padding:10px 14px; border-radius:var(--radius-xs); border:2px solid var(--border); font-size:13px; font-family:var(--font); margin-bottom:10px; outline:none; resize:vertical; }
.modal input:focus, .modal textarea:focus { border-color:var(--green); }
.modal .btn-row { justify-content:flex-end; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 24px; border-radius:20px; font-size:13px; font-weight:600; z-index:300; pointer-events:none; animation:toastIn .3s ease, toastOut .3s ease 2s forwards; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
@keyframes toastOut { from{opacity:1} to{opacity:0} }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#ddd; border-radius:3px; }

/* Responsive */
@media (max-width:700px) {
  .topic-sidebar { width:160px; }
  .expr-grid { grid-template-columns:1fr; }
  .read-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo"><span class="r">Reel</span><span class="t">Talk</span></div>
  <div class="header-spacer"></div>
  <div class="header-stat xp"><span class="icon">⚡</span><span id="xpDisplay">0</span></div>
  <div class="header-stat streak"><span class="icon">🔥</span><span id="streakDisplay">0</span></div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('topic')">🎯 话题</button>
  <button class="tab" onclick="switchTab('expr')">💬 地道表达</button>
  <button class="tab" onclick="switchTab('read')">📖 阅读跟练</button>
</div>

<!-- ============ TAB 1: 话题 ============ -->
<div class="view active topic-view" id="view-topic">
  <div class="topic-sidebar" id="topicSidebar"></div>
  <div class="topic-main" id="topicMain">
    <h2 id="topicTitle">选择话题开始练习</h2>
    <div class="subtitle" id="topicSubtitle">左侧选择话题 → 挑选风格 → 生成答案 → 跟读练习</div>
    <div class="style-row" id="styleRow"></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="genAnswer()">✨ 生成答案</button>
      <button class="btn btn-secondary" onclick="refreshQuestion()">🔄 换一题</button>
    </div>
    <div class="qcard" id="qcard" style="display:none"></div>
    <div class="acard" id="acard"></div>
  </div>
</div>

<!-- ============ TAB 2: 地道表达 ============ -->
<div class="view expr-view" id="view-expr">
  <div class="expr-cats" id="exprCats"></div>
  <div class="expr-body">
    <div class="expr-toolbar">
      <input class="search" placeholder="🔍 搜索表达..." oninput="renderExprGrid()" id="exprSearch">
      <button class="flashcard-btn" onclick="startFlashcard()">🃏 闪卡复习</button>
      <button class="btn btn-ghost btn-sm" onclick="exportExpressions()">📋 导出收藏</button>
    </div>
    <div class="expr-grid" id="exprGrid"></div>
  </div>
</div>

<!-- ============ TAB 3: 阅读跟练 ============ -->
<div class="view read-view" id="view-read">
  <div class="read-cats" id="readCats"></div>
  <div class="read-subtitle" id="readSubtitle"></div>
  <div class="read-body">
    <div class="read-grid" id="readGrid"></div>
  </div>
</div>

<!-- Practice Overlay -->
<div class="practice-overlay" id="practiceOverlay">
  <div class="practice-top">
    <button class="practice-close" onclick="closePractice()">✕</button>
    <div class="practice-title" id="practiceTitle">跟读练习</div>
    <div class="practice-spacer"></div>
    <div class="speed-controls">
      <button class="speed-btn" data-speed="0.7" onclick="setSpeed(0.7,this)">0.7x</button>
      <button class="speed-btn active" data-speed="1.0" onclick="setSpeed(1.0,this)">1x</button>
      <button class="speed-btn" data-speed="1.3" onclick="setSpeed(1.3,this)">1.3x</button>
    </div>
  </div>
  <div class="practice-body">
    <div class="practice-text" id="practiceText"></div>
    <button class="big-play-btn" id="bigPlayBtn" onclick="togglePracticePlay()">▶</button>

const SW = new Set(['the','a','an','is','are','was','were','be','been','being','have','has','had','do','does','did','will','would','could','should','may','might','can','shall','i','you','he','she','it','we','they','me','him','her','us','them','my','your','his','its','our','their','this','that','these','those','am','of','in','to','for','on','with','at','from','by','about','as','into','through','during','before','after','above','below','between','out','off','over','under','again','further','then','once','here','there','when','where','why','how','all','both','each','few','more','most','other','some','such','no','nor','not','only','own','same','so','than','too','very','just','because','but','and','or','if','while','up','down','what','which','who','whom']);
const DM = ['you know','i mean','like','right','okay','well','look','honestly','basically','literally','actually','obviously','seriously','here is the thing','the thing is','let me tell you','not gonna lie','to be honest','at the end of the day','kind of','sort of','come on','listen','i guess'];

function getDNA(styleId) {
  if (styleId === 'mf' && window.__MF_ANALYSIS__) return window.__MF_ANALYSIS__;
  const corpus = S.corpus.filter(c => c.profileId === styleId);
  if (!corpus.length) return null;
  const allText = corpus.map(c => c.text).join(' ');
  const words = allText.toLowerCase().split(/[\s,;:—\-"'()…]+/).filter(w=>w.length>0);
  const contentWords = words.filter(w => !SW.has(w) && w.length > 2);
  const freq = {}; contentWords.forEach(w=>{freq[w]=(freq[w]||0)+1;});
  const topWords = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const bigrams = {}; const trigrams = {};
  for (let i=0;i<words.length-1;i++){const bg=words[i]+' '+words[i+1];bigrams[bg]=(bigrams[bg]||0)+1;}
  for (let i=0;i<words.length-2;i++){const tg=words[i]+' '+words[i+1]+' '+words[i+2];trigrams[tg]=(trigrams[tg]||0)+1;}
  const topBigrams = Object.entries(bigrams).filter(([_,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([p,c])=>({phrase:p,count:c}));
  const topTrigrams = Object.entries(trigrams).filter(([_,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([p,c])=>({phrase:p,count:c}));
  const sentences = allText.split(/[.!?]+/).filter(s=>s.trim().length>5);
  const contractions = (allText.toLowerCase().match(/\b(it's|don't|can't|won't|isn't|aren't|didn't|doesn't|i'm|you're|they're|we're|that's|what's|let's|gonna|wanna|gotta|kinda|sorta)\b/g)||[]).length;
  const formality = Math.round(Math.max(1,Math.min(10, 8-(words.length>0?contractions/words.length*40:0))));
  const lowerText = ' '+allText.toLowerCase()+' ';
  const foundMarkers = DM.filter(m=>lowerText.includes(' '+m+' ')||lowerText.includes(' '+m+','));
  const sigExpr = topTrigrams.filter(t=>t.count>=2).map(t=>t.phrase);
  return {topWords,topBigrams,topTrigrams,sigExpr,formality,totalWords:words.length,avgSentLen:sentences.length?Math.round(words.length/sentences.length):8,discourseMarkers:foundMarkers,primaryTone:{tone:'neutral',intensity:5}};
}

  if (!dna) return { en: '请先投喂语料或选择有数据包支持的风格。', zh: '', expressions: [] };

  const topic = TOPIC_CONTENT[topicId] || { domain:'general', points:[{fragment:'it means a lot to me personally',vocab:[]}], topicWords:[] };
  const style = STYLE_PATTERNS[styleId] || STYLE_PATTERNS.mf;

  // Part 2 长题（>80字符）且有结构化示例 → 用示例生成完整故事
  if (question.length > 80 && topic.examples && topic.examples.length > 0) {
    return buildStructuredAnswer(topic, style, dna);
  }

  // Part 1 短题 → 片段拼接
  return buildShortAnswer(topic, style, dna);

function buildStructuredAnswer(topic, style, dna) {

  const closer = pick(style.closers);
  const markers = (dna.discourseMarkers||[]).filter(m=>m.length<12);

  // ── 组装英文答案（按雅思 Part 2 四段式框架）─
  const enParts = [
    `${opener}The one I'd pick is ${ex.title} — it's ${ex.type}. `,
    `${pick(style.transitions)}${ex.when}. `,
    `${pick(style.thoughtStarters)}${ex.about} `,
    `${pick(style.transitions)}${ex.why} `,
    `${pick(style.transitions)}${ex.recommend} `,
  ];
  if (ex.extra) {
    enParts.push(`${pick(style.transitions)}${ex.extra} `);
  }
  enParts.push(closer);
  let fullEn = enParts.join('');

  // 插入话语标记
  const marker = pick(markers);
  if (marker) {
    const mid = Math.floor(fullEn.length / 2);
    const dotIdx = fullEn.indexOf('.', mid);
    if (dotIdx > 0) {
      fullEn = fullEn.slice(0, dotIdx+1) + ' ' + marker + ', ' + fullEn.slice(dotIdx+2);
    }
  }

  // ── 组装中文翻译（不含风格 opener/closer）─
  const zhParts = [
    `我会选${ex.titleZh}——${ex.typeZh}。`,
    `${ex.whenZh}。`,
    `${ex.aboutZh}`,
    `${ex.whyZh}`,
    `${ex.recommendZh}。`,
  ];
  if (ex.extraZh) {
    zhParts.push(`${ex.extraZh}。`);
  }
  const fullZh = zhParts.join('');

  // ── 提取重点表达 ─
  const expressions = extractExpressions(fullEn);

  return { en: formatAnswer(fullEn, dna), zh: fullZh, expressions };
}

function buildShortAnswer(topic, style, dna) {
  const markers = (dna.discourseMarkers||[]).filter(m=>m.length<12);
  const opener = pick(style.openers);
  const points = shuffle([...topic.points]);
  const selected = points.slice(0, 2);

  const bodyParts = selected.map((point, i) => {
    const prefix = i === 0 ? pick(style.thoughtStarters) : pick(style.transitions);
    const filler = pick(style.filler);
    let fragment = point.fragment;
    fragment = injectFiller(fragment, filler);
    return `${prefix}${fragment}. `;
  });

  const body = bodyParts.join('');
  const closer = pick(style.closers);

  const marker = pick(markers);
  let fullAnswer = opener + body + closer;
  if (marker) {
    const mid = Math.floor(fullAnswer.length / 2);
    const dotIdx = fullAnswer.indexOf('.', mid);
    if (dotIdx > 0) {
      fullAnswer = fullAnswer.slice(0, dotIdx+1) + ' ' + marker + ', ' + fullAnswer.slice(dotIdx+2);
    }
  }

  return { en: formatAnswer(fullAnswer, dna), zh: '', expressions: [] };
}

function extractExpressions(answer) {
  const found = [];
  const lower = answer.toLowerCase();
  KEY_EXPRESSIONS.forEach(expr => {
    if (lower.includes(expr.en.toLowerCase()) && !found.some(f => f.en === expr.en)) {
      found.push(expr);
    }
  });
  return found.slice(0, 8);
}

// Weave a filler word naturally into a sentence fragment
function injectFiller(fragment, filler) {
  const strategies = [
    // After "it's" / "is"
    () => fragment.replace(/\b(it's|is)\b/i, `$1 ${filler}`),
    // After comma
    () => fragment.replace(/,\s*/, `, ${filler}, `),
    // Before "but" / "and"
    () => fragment.replace(/\b(but|and)\b/i, `${filler}, $1`),
    // Before verb (simple heuristic: word after "that" or subject)
    () => fragment.replace(/\b(that)\s+(\w)/i, `$1 ${filler} $2`),
    // Start of parenthetical
    () => fragment.replace(/\(/, `(${filler}, `),
    // Append at natural pause (after first clause ending in comma or period context)
    () => { const idx = fragment.indexOf(','); return idx > 0 ? fragment.slice(0,idx)+`, ${filler},`+fragment.slice(idx+1) : `${filler}, `+fragment; },
  ];
  const fn = strategies[Math.floor(Math.random() * strategies.length)];
  return fn();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pick(arr, fallback) {
  if (!arr || arr.length===0) return fallback;
  return arr[Math.floor(Math.random()*arr.length)];
}

function formatAnswer(text, dna) {
  // Highlight key expressions from DNA
  let hl = text;
  const sig = dna.sigExpr || [];
  const bg = (dna.topBigrams||[]).map(b=>b.phrase);
  const markers = dna.discourseMarkers || [];
  const toHL = [...new Set([...sig.slice(0,5),...bg.slice(0,3),...markers.slice(0,3)])];
  toHL.forEach(e => {
    const re = new RegExp('\\b'+e.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
    const eid = e.replace(/\s+/g,'-').toLowerCase();
    hl = hl.replace(re, `<span class="hl" data-expr="${e}" onclick="saveExprFromHL('${e.replace(/'/g,"\\'")}')">${e}</span>`);
  });
  return hl;
}

function findTopic(id) {
  for (const g of TOPICS) for (const t of g.items) if (t.id===id) return t;
  return null;
}

function refreshQuestion() {
  const tid = S.activeTopic;
  if (!tid || !TOPIC_QUESTIONS[tid]) return;
  const qs = TOPIC_QUESTIONS[tid];
  if (!S.selectedQuestionIndex) S.selectedQuestionIndex = {};
  if (S.selectedQuestionIndex[tid] === undefined) S.selectedQuestionIndex[tid] = 0;
  else S.selectedQuestionIndex[tid] = (S.selectedQuestionIndex[tid] + 1) % qs.length;
  const qi = S.selectedQuestionIndex[tid];
  const q = qs[qi];
  const topic = findTopic(tid);
  const part = topic ? TOPICS.find(g=>g.items.some(i=>i.id===tid)) : null;
  const partLabel = part ? part.group : '';
  const html = `<div class="q-label">${partLabel} · 第 ${qi+1}/${qs.length} 题</div>
    <div class="q-text">${q}</div>
    <div class="q-hint"><span>⏱ 准备 1 分钟</span><span>🗣 回答 1-2 分钟</span>${part && part.part===2?'<span>📝 可做笔记</span>':''}</div>`;
  document.getElementById('qcard').innerHTML = html;
  document.getElementById('qcard').style.display = 'block';
  document.getElementById('acard').classList.remove('show');
  document.getElementById('acard').innerHTML = '';
  save();
}

}

function genAnswer() {
  const tid = S.activeTopic;
  if (!tid || !TOPIC_QUESTIONS[tid]) { toast('请先选择话题'); return; }
  const qi = (S.selectedQuestionIndex||{})[tid]||0;
  const q = TOPIC_QUESTIONS[tid][qi];
  const styleId = S.activeStyle || 'mf';
  const profile = DEFAULT_PROFILES.find(p=>p.id===styleId) || S.profiles.find(p=>p.id===styleId) || DEFAULT_PROFILES[0];
  const dna = getDNA(styleId);
  if (!dna) { toast('⚠️ 该风格无数据，请先投喂语料'); return; }
  try {
    const result = generateAnswer(q, dna, styleId, tid);
    const acard = document.getElementById('acard');
    if (!acard) { toast('⚠️ 页面加载异常，请刷新'); return; }

    // 重点表达 HTML
    let exprHtml = '';
    if (result.expressions && result.expressions.length > 0) {
      exprHtml = `<div class="acard-section">
        <div class="acard-section-title">📌 重点表达</div>
        <div class="expr-chips">
          ${result.expressions.map(e => `<span class="expr-chip" onclick="saveExprFromHL('${e.en.replace(/'/g,"\\'")}')" title="${e.zh}"><b>${e.en}</b><span class="expr-chip-zh">${e.zh}</span></span>`).join('')}
        </div>
      </div>`;
    }

    // 中文翻译 HTML
    let zhHtml = '';
    if (result.zh) {
      zhHtml = `<div class="acard-section">
        <div class="acard-section-title">🇨🇳 中文翻译</div>
        <div class="acard-zh">${result.zh}</div>
      </div>`;
    }

    acard.innerHTML = `<div class="acard-header">
        <span class="acard-style">🎭 ${profile.name} · ${profile.tag||''}</span>
      </div>
      <div class="acard-text" id="answerText">${result.en}</div>
      ${zhHtml}
      ${exprHtml}
      <div class="acard-actions">
        <button class="btn btn-accent" onclick="startPractice()">🎧 跟读练习</button>
        <button class="btn btn-secondary btn-sm" onclick="genAnswer()">🔄 重新生成</button>
      </div>`;
    acard.classList.add('show');
    addXP(5);
  } catch(e) {
    console.error('genAnswer error:', e);
    toast('⚠️ 生成失败: ' + e.message);
  }
}

let practiceTimer = null, practiceWords = [], practiceIdx = 0, practiceSpeed = 1.0;
function startPractice() {
  const text = document.querySelector('.acard-text');
  if (!text) return;
  const raw = text.textContent.replace(/\s+/g,' ').trim();
  practiceWords = raw.split(/(\s+)/).filter(w=>w.trim());
  practiceIdx = 0;
  practiceSpeed = 1.0;
  document.getElementById('practiceOverlay').classList.add('show');
  document.getElementById('practiceTitle').textContent = '跟读练习';
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',b.dataset.speed==='1.0'));
  document.getElementById('bigPlayBtn').textContent = '▶';
  renderPracticeWords();
}
function renderPracticeWords() {
  const html = practiceWords.map((w,i)=>{
    let cls = 'word';
    if (i < practiceIdx) cls += ' done';
    if (i === practiceIdx) cls += ' active';
    return `<span class="${cls}" id="pw${i}">${w}</span>`;
  }).join('');
  document.getElementById('practiceText').innerHTML = html;
}
function togglePracticePlay() {
  const btn = document.getElementById('bigPlayBtn');
  if (practiceTimer) { clearInterval(practiceTimer); practiceTimer = null; btn.textContent = '▶'; btn.classList.remove('playing'); return; }
  btn.textContent = '⏸';
  btn.classList.add('playing');
  const baseInterval = 350;
  practiceTimer = setInterval(()=>{
    if (practiceIdx >= practiceWords.length) {
      clearInterval(practiceTimer); practiceTimer = null;
      btn.textContent = '▶'; btn.classList.remove('playing');
      return;
    }
    const word = practiceWords[practiceIdx].trim();
    const duration = Math.max(200, baseInterval + word.length * 40);
    practiceIdx++;
    renderPracticeWords();
    if (word && /^[a-zA-Z]/.test(word)) speak(word);
  }, baseInterval / practiceSpeed);
}
function setSpeed(s,btn) {
  practiceSpeed = s;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',b===btn));
  if (practiceTimer) { clearInterval(practiceTimer); practiceTimer=null; togglePracticePlay(); }
}
function closePractice() {
  if (practiceTimer) { clearInterval(practiceTimer); practiceTimer = null; }
  document.getElementById('practiceOverlay').classList.remove('show');
  addXP(5);
}
function speak(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = practiceSpeed; u.pitch = 1;
  window.speechSynthesis.speak(u);
}

function renderSnippets() {
  const grid = document.getElementById('readGrid');

  if (!readTopicId) {

      html += `<div class="read-section-title">${t.emoji} ${t.name} <span class="badge">${exps.length}条</span></div>`;
      html += renderSnippetCards(exps);
    });
    grid.innerHTML = html || '<div class="empty-hint">没有匹配的话题表达</div>';

  } else {
    // 单个话题
    const exps = TOPIC_EXPRESSIONS[readTopicId] || [];
    const topic = READ_TOPICS.find(t=>t.id===readTopicId);
    if (subtitle) subtitle.textContent = topic ? `${topic.emoji} ${topic.name} · ${exps.length} 条地道表达` : '';

      return;

function renderSnippetCards(exps) {
  // Group by function
  const FUNC_ORDER = ['开场破题','表达观点','举例说明','比较对比','总结收束'];
  const grouped = {};
  FUNC_ORDER.forEach(f => { grouped[f] = []; });
  exps.forEach(e => {
    if (grouped[e.function]) grouped[e.function].push(e);
    else (grouped['其他'] = grouped['其他']||[]).push(e);
  });

  let html = '';
  for (const [func, items] of Object.entries(grouped)) {
    if (!items.length) continue;
    const colors = { '开场破题':'#58cc02','表达观点':'#4a90d9','举例说明':'#ff9600','比较对比':'#ce82ff','总结收束':'#e85d75' };
    const color = colors[func] || '#888';
    html += `<div class="read-func-group">
      <div class="func-tag" style="background:${color}">${func}</div>
      <div class="func-cards">`;
    items.forEach(exp => {
      const saved = (S.savedSnippetIds||[]).includes(exp.highlight.slice(0,40));
      const enSafe = (exp.en||'').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,' ');
      const hlSafe = (exp.highlight||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');
      const translation = exp.translation || '';
      const thinking = exp.thinking || [];
      const keywords = exp.keywords || [];
      const cardId = 'card-' + Math.random().toString(36).slice(2,8);
      
      html += `<div class="snippet-card">
        <div class="func-label" style="color:${color}">◆ ${func}</div>
        <div class="quote">${highlightExpr(exp.en, exp.highlight)}</div>`;
      
      // Translation section (collapsible)
      if (translation) {
        html += `<div class="card-section card-translation" onclick="toggleCardSection(this)" data-target="${cardId}-tr">
          <span class="card-section-icon">🇨🇳</span> 中文翻译 <span class="card-toggle" id="${cardId}-tr-arrow">▶</span>
        </div>
        <div class="card-section-body" id="${cardId}-tr" style="display:none">
          <div class="card-trans-text">${translation.replace(/'/g,"\\'")}</div>
        </div>`;
      }
      
      // English thinking analysis
      if (thinking.length > 0) {
        html += `<div class="card-section card-thinking-hdr" onclick="toggleCardSection(this)" data-target="${cardId}-th">
          <span class="card-section-icon">🧠</span> 英语思维 <span class="card-toggle" id="${cardId}-th-arrow">▶</span>
        </div>
        <div class="card-section-body" id="${cardId}-th" style="display:none">
          ${thinking.map(t => `<div class="think-item">💡 ${t}</div>`).join('')}
        </div>`;
      }
      
      // Key expressions
      if (keywords.length > 0) {
        html += `<div class="card-section card-keywords-hdr" onclick="toggleCardSection(this)" data-target="${cardId}-kw">
          <span class="card-section-icon">📌</span> 重点表达 (${keywords.length}个) <span class="card-toggle" id="${cardId}-kw-arrow">▶</span>
        </div>
        <div class="card-section-body" id="${cardId}-kw" style="display:none">
          <div class="kw-tags">
            ${keywords.map(k => `<span class="kw-tag" onclick="event.stopPropagation();saveExpr('${(k.en||'').replace(/'/g,"\\'")}')" title="${k.category||''}">${k.en}${k.category ? '<small> · '+k.category+'</small>' : ''}</span>`).join('')}
          </div>
        </div>`;
      }
      
      html += `<div class="meta"><span>🎬 ${exp.source}</span></div>
        <div class="actions">
          <button class="play-snippet" onclick="event.stopPropagation();speakSnippet('${enSafe}')">🔊 聆听</button>
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();practiceSnippet('${enSafe}')">🎤 跟读</button>
          <button class="btn btn-ghost btn-sm ${saved?'saved':''}" onclick="event.stopPropagation();toggleSnippet('${hlSafe.slice(0,40).replace(/'/g,"\\'")}')">${saved?'❤️':'♡'}</button>
        </div>
      </div>`;
    });
    html += '</div></div>';
  }
  return html;
}

function highlightExpr(text, highlight) {
  // Bold the highlight sentence within the context
  const hlLower = highlight.toLowerCase();
  const idx = text.toLowerCase().indexOf(hlLower);
  if (idx >= 0) {
    const before = text.slice(0, idx);
    const match = text.slice(idx, idx + highlight.length);
    const after = text.slice(idx + highlight.length);
    return `${before}<span class="qh">${match}</span>${after}`;
  }
  return text;
}
function speakSnippet(text) { speak(text); }
function practiceSnippet(text) {
  const raw = text.replace(/\s+/g,' ').trim();
  practiceWords = raw.split(/(\s+)/).filter(w=>w.trim());
  practiceIdx = 0; practiceSpeed = 1.0;
  document.getElementById('practiceOverlay').classList.add('show');
  document.getElementById('practiceTitle').textContent = '阅读跟练';
  document.getElementById('bigPlayBtn').textContent = '▶';
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',b.dataset.speed==='1.0'));
  renderPracticeWords();
}
function toggleSnippet(key) {
  if (!S.savedSnippetIds) S.savedSnippetIds = [];
  const idx = S.savedSnippetIds.indexOf(key);
  if (idx>=0) S.savedSnippetIds.splice(idx,1);
  else { S.savedSnippetIds.push(key); addXP(1); }
  save();
  renderSnippets();
}

function toggleCardSection(el) {
  const targetId = el.getAttribute('data-target');
  const body = document.getElementById(targetId);
  const arrow = el.querySelector('.card-toggle');
  if (!body || !arrow) return;
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  arrow.classList.toggle('open', !isOpen);
}

function saveExpr(expr) {
  if (!expr) return;
  if (!S.savedExpressions) S.savedExpressions = [];
  if (S.savedExpressions.includes(expr)) return;
  S.savedExpressions.push(expr);
  save();
  toast('✅ 已收藏: ' + expr);
}

// ============================================================
//  UTILS
// ============================================================
function addXP(n) {
  S.xp = (S.xp||0) + n;
  save();
  updateHeader();
}
function updateHeader() {
  document.getElementById('xpDisplay').textContent = S.xp||0;
  document.getElementById('streakDisplay').textContent = S.streak||0;
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>el.remove(), 2500);
}
function saveExprFromHL(expr) {
  if (!S.savedExprIds) S.savedExprIds = [];
  if (!S.savedExprIds.includes(expr)) { S.savedExprIds.push(expr); addXP(2); save(); toast('⭐ 已收藏: '+expr); }
  else toast('已收藏过了');
}
function addProfileUI() {
  const name = prompt('风格名称：');
  if (!name) return;
  const id = 'custom_'+Date.now();
  S.profiles.push({id, name, color:'#'+Math.floor(Math.random()*16777215).toString(16), createdAt:new Date().toISOString()});
  save();
  renderTopicView();
  toast('✅ 已创建风格: '+name);
}

// ============================================================
//  INIT
// ============================================================
function init() {
  updateHeader();
  renderTopicView();
  if (!S.activeTopic) S.activeTopic = 'hometown';
  refreshQuestion();
  save();
}
init();
console.log('🎬 ReelTalk v4 — 话题 · 表达 · 阅读');
</script>
</body>
</html>
